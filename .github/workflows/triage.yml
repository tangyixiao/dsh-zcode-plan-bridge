name: PR labels
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Metadata only: no checkout, package installation, PR code or secrets.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: pr.number, per_page: 100});
            const labels = new Set();
            if (files.some(f => /(^|\/)(docs|README)|\.md$/.test(f.filename))) labels.add('documentation');
            if (files.some(f => /(^|\/)(package(-lock)?\.json|pnpm-lock\.yaml|dependabot\.yml)$/.test(f.filename)) || pr.user.login === 'dependabot[bot]') labels.add('dependencies');
            if (files.some(f => f.filename.startsWith('.github/'))) labels.add('maintenance');
            if (/^fix(?:\(|:)/i.test(pr.title)) labels.add('bug');
            if (/^feat(?:\(|:)/i.test(pr.title)) labels.add('enhancement');
            if (labels.size) await github.rest.issues.addLabels({...context.repo, issue_number: pr.number, labels: [...labels]});
